<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المتصدرين</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a237e; direction: rtl; text-align: center; color: white; }
    .card { background: white; color: #333; padding: 20px; border-radius: 15px; margin: 15px auto; max-width: 500px; }
    button { padding: 15px; margin: 5px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; width: 100%; }
    .green { background: #4CAF50; color: white; }
    .blue { background: #2196F3; color: white; }
    .player { display: flex; align-items: center; padding: 10px; margin: 5px 0; background: #f5f5f5; border-radius: 10px; border-right: 4px solid #2196F3; }
    .rank { width: 35px; height: 35px; border-radius: 50%; background: #FFD700; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-left: 10px; flex-shrink: 0; }
    .info { flex: 1; text-align: right; }
    .score { font-size: 22px; font-weight: bold; color: #4CAF50; flex-shrink: 0; }
    input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; margin: 10px 0; }
    .msg { padding: 10px; border-radius: 8px; margin: 10px 0; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
    .wait { background: #fff3cd; color: #856404; }
    h3 { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>🏆 لوحة المتصدرين</h1>
  <p>🟢 بيانات مشتركة - الجميع يرى نفس القائمة</p>
  
  <div class="card">
    <h3>➕ أضف اسمك</h3>
    <input type="text" id="nameInput" placeholder="اكتب اسمك..." maxlength="20">
    <button class="green" onclick="add()">✅ انضم</button>
    <div id="msg"></div>
  </div>
  
  <div class="card">
    <h3>📊 المتصدرين</h3>
    <button class="blue" onclick="load()">🔄 تحديث</button>
    <div id="list"></div>
  </div>

  <script>
    // مفتاح ثابت للجميع - هذا يجعل البيانات مشتركة
    var BLOB_ID = 'a30bec20743a86cd202b924adc4c49e4';
    var URL = 'https://jsonblob.com/api/jsonBlob/' + BLOB_ID;
    
    async function read() {
      try {
        var r = await fetch(URL);
        return await r.json();
      } catch(e) { return []; }
    }
    
    async function write(data) {
      try {
        var r = await fetch(URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        return r.ok;
      } catch(e) { return false; }
    }
    
    async function add() {
      var inp = document.getElementById('nameInput');
      var name = inp.value.trim();
      if (!name) { msg('⚠️ اكتب اسمك أولاً', 'err'); return; }
      msg('⏳ جاري الإضافة...', 'wait');
      var board = await read();
      board.push({ name: name, score: Math.floor(Math.random() * 25) + 75, tests: Math.floor(Math.random() * 12) + 1, date: new Date().toLocaleDateString('ar-SY') });
      board.sort(function(a, b) { return b.score - a.score; });
      var ok = await write(board.slice(0, 50));
      if (ok) { msg('✅ تمت إضافة ' + name, 'ok'); inp.value = ''; load(); }
      else { msg('❌ فشل الحفظ', 'err'); }
    }
    
    async function load() {
      var div = document.getElementById('list');
      var board = await read();
      if (board.length === 0) { div.innerHTML = '<p style="color:#888;padding:20px;">📭 لا يوجد متصدرين بعد</p>'; return; }
      var html = '';
      for (var i = 0; i < board.length; i++) {
        var p = board[i];
        var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1);
        html += '<div class="player"><div class="rank">' + medal + '</div><div class="info"><b>' + p.name + '</b><br><small>📝 ' + p.tests + ' اختبار | 📅 ' + p.date + '</small></div><div class="score">' + p.score + '%</div></div>';
      }
      div.innerHTML = html;
    }
    
    function msg(text, type) { document.getElementById('msg').innerHTML = '<div class="msg ' + type + '">' + text + '</div>'; }
    load();
  </script>
</body>
</html>
